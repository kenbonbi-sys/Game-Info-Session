<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fox Swarm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel: rgba(14, 22, 44, 0.86);
      --edge: rgba(90, 209, 255, 0.45);
      --cyan: #5ad1ff;
      --gold: #ffd23f;
      --text: #eaf4ff;
      --muted: #8fa6c4;
      --font: 'Pixelify Sans', 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1320; color: var(--text); font-family: var(--font); }
    canvas#game { position: fixed; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

    .panel { position: fixed; background: var(--panel); border: 2px solid var(--edge); border-radius: 12px; padding: 10px 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); user-select: none; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .small { font-size: 13px; color: var(--muted); }
    b { color: var(--text); font-weight: 600; }

    #stats { top: 12px; left: 12px; width: 250px; }
    #stats .name { color: var(--cyan); font-weight: 700; font-size: 16px; }
    #stats #lv { font-weight: 700; }
    .bar { position: relative; height: 14px; margin-top: 8px; background: #1b1f33; border: 2px solid #05070f; border-radius: 4px; overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 0.12s linear; }
    .bar span { position: absolute; inset: 0; font-size: 10px; line-height: 10px; text-align: center; text-shadow: 1px 1px 0 #000; }
    .bar.hp i { background: linear-gradient(#ff6b6b, #c62f3a); }
    .bar.xp i { background: linear-gradient(#7dffb0, #28b36a); }
    .bar.dash { height: 6px; margin-top: 6px; }
    .bar.dash i { background: var(--cyan); transition: none; }
    #stats .row.small { margin-top: 8px; }
    .rack { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 6px; }
    .rack-label { margin-top: 9px; font-size: 11px; letter-spacing: 1px; color: var(--muted); }
    .slot { position: relative; height: 32px; border: 2px solid #33415f; border-radius: 6px; background: #121a30; display: grid; place-items: center; font-size: 16px; }
    .slot b { position: absolute; right: 2px; bottom: -1px; font-size: 10px; color: var(--gold); }
    .slot.empty { opacity: 0.35; }
    .slot.maxed { border-color: var(--cyan); }
    .slot.evo { border-color: var(--gold); background: #2a2410; box-shadow: 0 0 8px rgba(255, 210, 63, 0.45); }

    #info { top: 12px; right: 12px; text-align: right; font-size: 13px; }
    #info .title { color: var(--gold); font-size: 16px; font-weight: 700; margin-bottom: 4px; }

    #controls { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 18px; white-space: nowrap; align-items: center; font-size: 13px; color: var(--muted); padding: 8px 14px; }
    kbd { display: inline-block; min-width: 22px; padding: 2px 6px; margin: 0 1px; border: 2px solid var(--edge); border-bottom-width: 4px; border-radius: 5px; background: #0b1224; color: var(--text); font-family: var(--font); font-size: 12px; text-align: center; }

    #toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -80px); padding: 8px 16px; background: var(--panel); border: 2px solid var(--gold); border-radius: 10px; color: var(--gold); transition: transform 0.25s; pointer-events: none; }
    #toast.show { transform: translate(-50%, 0); }

    #modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(4, 8, 18, 0.62); padding: 16px; }
    .modal-card { width: min(760px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 2px solid var(--edge); border-radius: 16px; padding: 20px 22px; text-align: center; }
    .modal-card h2 { margin: 0 0 6px; color: var(--gold); font-size: 30px; letter-spacing: 1px; }
    .modal-card h3 { margin: 0 0 8px; color: var(--cyan); font-size: 16px; }
    .hint { color: var(--muted); font-size: 14px; margin: 4px 0 14px; line-height: 1.5; }
    .big { font-size: 18px; }
    #modalActions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn { font-family: var(--font); font-size: 16px; padding: 10px 18px; border-radius: 10px; border: 2px solid var(--gold); border-bottom-width: 5px; background: #2a2410; color: var(--gold); cursor: pointer; }
    .btn.ghost { border-color: var(--edge); background: #0f1a30; color: var(--text); }
    .btn:hover { filter: brightness(1.2); }
    .choice { position: relative; flex: 1 1 200px; max-width: 230px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 12px 14px; font-family: var(--font); color: var(--text); background: #111b34; border: 2px solid var(--edge); border-bottom-width: 5px; border-radius: 12px; cursor: pointer; }
    .choice:hover { border-color: var(--gold); transform: translateY(-2px); }
    .choice .key { position: absolute; top: 6px; left: 8px; color: var(--muted); font-size: 12px; }
    .choice .icon { font-size: 32px; }
    .choice .title { font-size: 18px; font-weight: 700; color: var(--cyan); }
    .choice .lvl { font-size: 12px; color: var(--gold); }
    .choice .desc { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .choice.perk .title { color: #9ef0b4; }
    .choice.evo { border-color: var(--gold); background: linear-gradient(#3a2f10, #1c1608); box-shadow: 0 0 14px rgba(255, 210, 63, 0.4); }
    .choice.evo .title { color: var(--gold); }
    .choice.evo .lvl { color: #fff3c4; }
    .loot { font-size: 17px; margin: 6px 0; }
    .loot b { color: var(--gold); }
    .pause-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 22px; text-align: left; margin-bottom: 16px; }
    .pause-grid ul { margin: 0; padding-left: 18px; line-height: 2.1; font-size: 14px; white-space: nowrap; }
    .sheet-preview { overflow-x: auto; background: repeating-conic-gradient(#1a2440 0 25%, #121a30 0 50%) 0 0 / 12px 12px; border-radius: 8px; padding: 6px; }
    .sheet-preview canvas { image-rendering: pixelated; display: block; max-width: 100%; height: auto; }
    @media (max-width: 640px) { .pause-grid { grid-template-columns: 1fr; } #controls { display: none; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="stats" class="panel">
    <div class="row"><span class="name">Fox (YOU)</span><span id="lv">Lv.1</span></div>
    <div class="bar hp"><i id="hpFill"></i><span id="hpText">130/130</span></div>
    <div class="bar xp"><i id="xpFill"></i><span id="xpText">0/6</span></div>
    <div class="bar dash" title="Lướt (Space)"><i id="dashFill"></i></div>
    <div class="row small"><span>⏱ <b id="time">00:00</b></span><span>💀 <b id="kills">0</b></span><span>💰 <b id="gold">0</b></span></div>
    <div class="rack-label">CHIÊU</div>
    <div id="weaponSlots" class="rack"></div>
    <div class="rack-label">PERK</div>
    <div id="perkSlots" class="rack"></div>
  </div>

  <div id="info" class="panel">
    <div class="title">🦊 LOCAL TEST</div>
    <div>Quái: <b id="enemyCount">0</b> · Đợt <b id="wave">1</b> · FPS <b id="fps">0</b></div>
    <div class="small">Anim: <b id="animName">idle</b></div>
    <div class="small">Sprite: <b id="spriteSource">…</b></div>
  </div>

  <div id="controls" class="panel">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> di chuyển</span>
    <span><kbd>Space</kbd> lướt</span>
    <span><kbd>Esc</kbd> tạm dừng</span>
    <span><kbd>B</kbd> boss</span>
    <span><kbd>N</kbd> đầu lĩnh</span>
    <span><kbd>H</kbd> hitbox</span>
    <span><kbd>K</kbd> xuất sprite</span>
  </div>

  <div id="toast"></div>

  <div id="modal" hidden>
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalActions"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
