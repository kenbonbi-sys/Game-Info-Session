<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quái Vật Dễ Sợ · Màn chiếu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👹</text></svg>">
  <link rel="stylesheet" href="src/pixel.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--page) url("assets/design/cio-academy/assets/bg/bg-main.png") center bottom / cover no-repeat fixed;
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { padding: 22px 28px 40px; display: grid; gap: 28px; }

    /* Top bar */
    .topbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 14px 22px; }
    .brand { font: 900 28px/1 var(--font-disp); letter-spacing: -0.01em; }
    .brand .b { color: var(--blue); }
    .brand .vs { color: var(--ink-3); font-size: 20px; }
    .brand .e { color: var(--rose); }
    .topbar .chip { font-size: 13px; }
    #players { font-family: var(--font-pixel); font-size: 11px; }
    .actions { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }

    /* Lobby */
    #lobby { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 32px; align-items: start; }
    .join { text-align: center; padding: 24px; }
    #qr { background: #fff; border: 3px solid var(--ink); padding: 12px; aspect-ratio: 1; display: grid; place-items: center; color: var(--ink-2); font-size: 16px; }
    #qr svg { width: 100%; height: 100%; }
    .url { margin-top: 16px; font: 800 24px/1.2 var(--font-disp); color: var(--blue-d); word-break: break-all; }
    .url-pick { margin-top: 10px; max-width: 100%; padding: 6px 10px; font: 700 15px var(--font-disp); color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 0; }
    .muted { color: var(--ink-2); font-size: 16px; }
    .roster { padding: 24px 26px; }
    .roster h2 { margin: 8px 0 18px; font: 900 40px/1.05 var(--font-disp); }
    .roster h2 b { font-family: var(--font-pixel); font-size: 30px; color: var(--amber-d); }
    .names { display: flex; flex-wrap: wrap; gap: 12px; }
    .names span { --face: var(--blue-l); padding: 8px 14px; font: 700 18px/1 var(--font-disp); color: var(--blue-d); animation: ca-popin 0.3s steps(6) both; }

    /* Question */
    #play { display: grid; grid-template-columns: 1fr minmax(280px, 380px); gap: 30px; align-items: start; }
    .qpanel { padding: 26px 28px; }
    .qhead { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    #qMeta { font: 800 20px var(--font-disp); color: var(--ink-2); }
    .countdown { --face: var(--amber); min-width: 96px; height: 72px; padding: 0 14px; display: grid; place-items: center; font: 26px/1 var(--font-pixel); color: var(--ink); }
    #qText { margin: 18px 0 24px; font: 900 clamp(26px, 3vw, 42px)/1.2 var(--font-disp); text-wrap: pretty; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .option { --face: var(--paper); display: flex; align-items: center; gap: 14px; min-height: 92px; padding: 14px 18px; overflow: hidden; font: 600 clamp(17px, 1.6vw, 24px)/1.3 var(--font-sans); filter: drop-shadow(3px 3px 0 var(--shadow)); }
    .option b, .option span, .option em { position: relative; z-index: 1; }
    .option b { flex: none; width: 46px; height: 46px; display: grid; place-items: center; font: 16px/1 var(--font-pixel); color: #fff; background: var(--ink); clip-path: var(--clip-chip-in); }
    .option i { position: absolute; inset: 2px auto 2px 2px; z-index: 0; background: rgba(59, 130, 246, 0.14); transition: width 0.5s steps(8); }
    .option em { margin-left: auto; font: normal 22px/1 var(--font-pixel); color: var(--ink); }
    .opt-0 b { background: var(--amber); color: var(--ink); }
    .opt-1 b { background: var(--blue); }
    .opt-2 b { background: var(--green); }
    .opt-3 b { background: var(--violet); }
    .option.correct { --face: var(--green-l); --line: var(--green-d); color: var(--green-d); }
    .option.correct em { color: var(--green-d); }
    .option.correct i { background: rgba(22, 163, 74, 0.2); }
    .option.dim { opacity: 0.4; }
    .qpanel .pbar { margin: 24px 0 10px; }
    #answered { margin: 0; font: 700 18px var(--font-disp); color: var(--ink-2); }

    .side { text-align: center; padding: 20px; }
    #bossCanvas { width: 100%; max-width: 300px; image-rendering: pixelated; }
    .side .pbar { margin: 6px 0 10px; height: 22px; }
    #hallText { margin: 0; font: 700 15px/1.4 var(--font-disp); color: var(--ink-2); }
    .top { margin-top: 18px; text-align: left; }
    .top h3 { margin: 0 0 10px; font: 900 22px var(--font-disp); color: var(--amber-d); }
    .top ol, .podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .top li, .podium li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; font: 700 18px var(--font-disp); background: var(--cream); border: 2px solid var(--cream-3); }
    .top li b, .podium li b { width: 36px; font: 13px/1 var(--font-pixel); color: var(--amber-d); }
    .top li em, .podium li em { margin-left: auto; font: normal 13px/1 var(--font-pixel); color: var(--blue-d); }

    /* End */
    #end { max-width: 900px; margin: 0 auto; width: 100%; }
    .end-panel { padding: 30px 34px; text-align: center; }
    .title { margin: 14px 0 22px; font: 900 60px/1 var(--font-disp); color: var(--ink); }
    .podium li { font-size: 30px; padding: 16px 22px; }
    .podium li b { font-size: 18px; width: 56px; }
    .podium li em { font-size: 18px; }
    .podium li:first-child { font-size: 38px; background: var(--amber-l); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); }
    #endStats { margin-top: 18px; }

    #conn { --face: var(--rose-l); position: fixed; left: 50%; translate: -50% 0; bottom: 20px; padding: 12px 18px; font: 700 16px var(--font-disp); color: var(--rose-d); }
    .option span { flex: 1; min-width: 0; }
    @media (max-width: 1280px) { #play { grid-template-columns: 1fr minmax(220px, 300px); } .options { grid-template-columns: 1fr; } .option { min-height: 64px; } }
    @media (max-width: 900px) { #lobby, #play { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="px topbar">
      <div class="brand"><span class="b">BUDDY</span> <span class="vs">vs</span> <span class="e">QUÁI VẬT DỄ SỢ</span></div>
      <span class="chip soft-blue"><span id="players">0</span> người chơi</span>
      <span class="chip soft-amber" id="phaseLabel">Phòng chờ</span>
      <div class="actions">
        <button id="startBtn" class="pbtn b-amber" title="Enter">Bắt đầu</button>
        <button id="nextBtn" class="pbtn" title="Enter / →">Câu tiếp</button>
        <button id="autoBtn" class="pbtn b-white sm">Tự chuyển câu: BẬT</button>
        <a id="csvBtn" class="pbtn b-white sm" href="#">Tải CSV</a>
        <button id="resetBtn" class="pbtn b-rose sm">Reset</button>
      </div>
    </header>

    <main>
      <section id="lobby">
        <div class="px join">
          <i class="riv l"></i><i class="riv r"></i>
          <div id="qr">Đang tạo QR…</div>
          <div class="url" id="joinUrl"></div>
          <select id="urlPick" class="url-pick" title="Điện thoại không vào được? Thử link khác" hidden></select>
          <p class="muted">Quét QR hoặc gõ link trên điện thoại (cùng wifi)</p>
        </div>
        <div class="px roster">
          <span class="chip soft-blue eyebrow font-pixel">LOBBY</span>
          <h2><b id="lobbyCount">0</b> người đã vào</h2>
          <div id="names" class="names"></div>
        </div>
      </section>

      <section id="play" hidden>
        <div class="px qpanel">
          <i class="riv l"></i><i class="riv r"></i>
          <div class="qhead"><span id="qMeta"></span><span id="countdown" class="countdown"></span></div>
          <h1 id="qText"></h1>
          <div id="options" class="options"></div>
          <div class="pbar amber live"><i id="timeFill"></i></div>
          <p id="answered"></p>
        </div>
        <aside class="px side">
          <i class="riv l"></i><i class="riv r"></i>
          <canvas id="bossCanvas" width="168" height="168"></canvas>
          <div class="pbar rose"><i id="hallHp"></i></div>
          <p id="hallText"></p>
          <div id="top5" class="top"></div>
        </aside>
      </section>

      <section id="end" hidden>
        <div class="px end-panel">
          <i class="riv l"></i><i class="riv r"></i>
          <span class="chip soft-amber font-pixel">LEADERBOARD</span>
          <h1 class="title">🏆 Top 5</h1>
          <ol id="podium" class="podium"></ol>
          <p class="muted" id="endStats"></p>
        </div>
      </section>
    </main>
  </div>

  <div id="conn" class="px tier-card" hidden>Mất kết nối server, đang thử lại…</div>
  <script type="module" src="src/host.js"></script>
</body>
</html>
